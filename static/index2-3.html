<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FutureYou | Profile Question 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles2.css" />
</head>

<body>

    <!-- TOP NAV -->
    <header class="top-nav">
        <div class="logo-area">
            <div class="logo-icon">✦</div>
            <span class="logo-text">FutureYou</span>
        </div>
    </header>

    <!-- PROGRESS -->
    <section class="progress-section">
        <div class="progress-info">
            <span class="question-count">Question 3 of 7</span>
            <span class="progress-percent">43%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" style="width:43%"></div>
        </div>
    </section>

    <!-- MAIN -->
    <main class="question-container">
        <div class="question-inner">
            <h1 class="question-title">What tasks do you enjoy most?</h1>
            <p class="subtitle">Select all that energize you.</p>

            <div class="pill-grid" id="pillGrid">
                <div class="pill"><span class="pill-ico">🧩</span>Problem Solving</div>
                <div class="pill"><span class="pill-ico">🎨</span>Creative Work</div>
                <div class="pill"><span class="pill-ico">📊</span>Data &amp; Analysis</div>
                <div class="pill"><span class="pill-ico">👥</span>People Management</div>
                <div class="pill"><span class="pill-ico">✍️</span>Writing &amp; Communication</div>
                <div class="pill"><span class="pill-ico">🗺️</span>Strategy &amp; Planning</div>
                <div class="pill"><span class="pill-ico">🛠️</span>Building Things</div>
                <div class="pill"><span class="pill-ico">🎓</span>Teaching &amp; Mentoring</div>
            </div>
        </div>
    </main>

    <!-- BOTTOM NAV -->
    <footer class="bottom-nav">
        <a class="btn-back" href="index2-2.html">← Back</a>

        <button class="btn-continue" id="continueBtn">
            Continue <span aria-hidden="true">→</span>
        </button>
    </footer>

    <script src="app-state.js"></script>
    <script>
        const pills = document.querySelectorAll(".pill");
        pills.forEach(p => p.addEventListener("click", () => p.classList.toggle("selected")));

        document.getElementById("continueBtn").addEventListener("click", () => {
            const selected = Array.from(document.querySelectorAll(".pill.selected"))
                .map(p => p.textContent.trim());

            if (selected.length === 0) {
                alert("Please select at least one option.");
                return;
            }

            updateProfileField("enjoyTasks", selected);
            window.location.href = "index2-4.html";
        });
    </script>

</body>

</html>
